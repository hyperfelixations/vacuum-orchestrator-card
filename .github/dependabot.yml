# Security updates arrive one advisory per pull request; routine tooling updates are grouped.
# Actions are pinned to commit SHAs; Dependabot moves the SHA and its version comment together.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      tooling:
        dependency-type: development
        applies-to: version-updates

  # The workflows and the composite actions they use.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
        applies-to: version-updates
