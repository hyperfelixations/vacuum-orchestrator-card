# Dependency audit: any advisory against a runtime dependency fails, and every installed package
# needs a valid registry signature. Advisories against build and test tooling do not stop CI, since
# none of that code ships: the job summary lists them, and GitHub raises Dependabot alerts and
# security updates. The schedule catches advisories published without a new commit.

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Report advisories against build and test tooling
        run: npm run report:advisories

      - name: Audit dependencies and registry signatures
        run: npm run check:security
