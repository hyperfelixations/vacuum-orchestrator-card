# Three independent jobs with no `needs:` between them; each builds the bundle itself, so no job
# reports green against an artifact it did not produce. dist/ is not committed.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only: this workflow tests, it never publishes.
permissions:
  contents: read

jobs:
  node:
    name: Code & Node test layers
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Nothing here pushes; a persisted token would let a later step write to the repo.
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The card's tests play the real integration's answers; see internal dev doc §10.
      - name: Record the integration at test/voi-ref
        uses: ./.github/actions/record-voi

      - name: Build the bundle from src/
        run: npm run build

      - name: Syntax check
        run: npm run check:run

      - name: All Node test layers
        run: npm run test:node:run

  browser:
    name: Browser tests and coverage
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # The card's tests play the real integration's answers; see internal dev doc §10.
      - name: Record the integration at test/voi-ref
        uses: ./.github/actions/record-voi

      # Repeated on purpose: this job must not pass against a bundle another job produced.
      - name: Build the bundle from src/
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium firefox webkit

      - name: Source-normalized coverage across unit, bundle, surface and browser
        run: npm run coverage:run

      # coverage already ran the full Chromium suite; only the other engines are left.
      - name: Firefox and WebKit core
        run: npm run test:browser:cross-engine:run

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-layers
          path: coverage/
          retention-days: 14

      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The card in the real Home Assistant frontend: the integration's E2E host at test/voi-ref with
  # this bundle on its dashboard (internal dev doc §10 "Smoke-Test"). Linux, as the host's CI.
  e2e:
    name: Smoke test in the real frontend
    # The Python baseline has no build for later Ubuntu releases.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the pinned integration commit
        id: pin
        shell: bash
        run: |
          sha="$(tr -d '[:space:]' < test/voi-ref)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "test/voi-ref must hold one full commit SHA." >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the integration
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: hyperfelixations/vacuum-orchestrator
          ref: ${{ steps.pin.outputs.sha }}
          path: .voi-checkout
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Set up Python for the integration's E2E host
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.2"
          cache: pip
          cache-dependency-path: .voi-checkout/requirements-e2e.txt

      - name: Install the E2E host's requirements
        run: python -m pip install -r .voi-checkout/requirements-e2e.txt

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build the card and run the smoke test
        run: npm run test:e2e
        env:
          VOI_CHECKOUT: .voi-checkout
          VOI_PYTHON: python

      # Error contexts only: the configuration keeps no trace or video, so no token leaves the run.
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14
