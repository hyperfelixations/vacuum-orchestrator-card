<div class="voc-root" data-state="view" data-tone="idle" style="--tone-color:var(--success-color, #43a047);--tone-ink:color-mix(in srgb, var(--success-color, #43a047) 82%, var(--primary-text-color));--tone-soft:color-mix(in srgb, var(--success-color, #43a047) 20%, transparent);--tone-border:color-mix(in srgb, var(--tone-ink) 38%, transparent);" tabindex="-1">
<div class="voc-top-line">
</div>
<div class="voc-header">
<div class="voc-icon-badge" aria-hidden="true">
<ha-icon icon="mdi:robot-vacuum" aria-hidden="true">
</ha-icon>
</div>
<div class="voc-title-block">
<div class="voc-title">Cleaning</div>
<div class="voc-subtitle">Nothing waiting</div>
</div>
<div class="voc-status-pill">Ready</div>
</div>
<div class="voc-panel" data-queue-mode="idle">
<div class="voc-panel-headline">
<span class="voc-panel-label">Waiting</span>
<span class="voc-panel-value">0</span>
</div>
<div class="voc-panel-status">
<div class="voc-panel-mode">
<span class="voc-dot" aria-hidden="true">
</span>
<span>Queue idle</span>
</div>
<div class="voc-panel-robots">
<span class="voc-panel-robot" data-key="robot:robot-rocky" data-tone="ready">
<span class="voc-dot" aria-hidden="true">
</span>Rocky · Cleaning · 76 %</span>
<span class="voc-panel-robot" data-key="robot:robot-dusty" data-tone="ready">
<span class="voc-dot" aria-hidden="true">
</span>Dusty · Docked · 100 %</span>
</div>
</div>
<div class="voc-panel-control">
<button type="button" class="voc-button voc-button--primary voc-queue-control" data-action="queue-control" title="Start queue">
<ha-icon icon="mdi:play" aria-hidden="true">
</ha-icon>
<span class="voc-button-label">Start queue</span>
</button>
</div>
</div>
<div class="voc-tab-row">
<div class="voc-tabs" role="tablist" aria-label="Views">
<button type="button" class="voc-tab" role="tab" id="voc-tab-queue" data-key="tab-queue" data-view="queue" aria-controls="voc-panel" aria-selected="true" tabindex="0" title="Queue">
<ha-icon icon="mdi:format-list-numbered" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">Queue</span>
</button>
<button type="button" class="voc-tab" role="tab" id="voc-tab-rooms" data-key="tab-rooms" data-view="rooms" aria-controls="voc-panel" aria-selected="false" tabindex="-1" title="Rooms">
<ha-icon icon="mdi:floor-plan" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">Rooms</span>
</button>
<button type="button" class="voc-tab" role="tab" id="voc-tab-robots" data-key="tab-robots" data-view="robots" aria-controls="voc-panel" aria-selected="false" tabindex="-1" title="Robots">
<ha-icon icon="mdi:robot-vacuum" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">Robots</span>
</button>
<button type="button" class="voc-tab" role="tab" id="voc-tab-templates" data-key="tab-templates" data-view="templates" aria-controls="voc-panel" aria-selected="false" tabindex="-1" title="Templates">
<ha-icon icon="mdi:content-copy" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">Templates</span>
</button>
<button type="button" class="voc-tab" role="tab" id="voc-tab-history" data-key="tab-history" data-view="history" aria-controls="voc-panel" aria-selected="false" tabindex="-1" title="History">
<ha-icon icon="mdi:history" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">History</span>
</button>
<button type="button" class="voc-tab" role="tab" id="voc-tab-settings" data-key="tab-settings" data-view="settings" aria-controls="voc-panel" aria-selected="false" tabindex="-1" title="Settings">
<ha-icon icon="mdi:cog-outline" aria-hidden="true">
</ha-icon>
<span class="voc-tab-label">Settings</span>
</button>
</div>
<button type="button" class="voc-button voc-button--quiet voc-primary-action" data-action="create-job" title="Add job">
<ha-icon icon="mdi:plus" aria-hidden="true">
</ha-icon>
<span class="voc-button-label">Add job</span>
</button>
</div>
<div class="voc-body" id="voc-panel" data-body="view:queue" role="tabpanel" aria-labelledby="voc-tab-queue">
<div class="voc-view voc-queue" data-key="view:queue">
<div class="voc-empty" data-key="empty">
<ha-icon icon="mdi:playlist-check" aria-hidden="true">
</ha-icon>
<div>No jobs are waiting.</div>
<div class="voc-empty-actions">
<button type="button" class="voc-button voc-button--primary" data-action="create-job">
<ha-icon icon="mdi:plus" aria-hidden="true">
</ha-icon>
<span class="voc-button-label">Add job</span>
</button>
<button type="button" class="voc-button voc-button--text" data-action="create-from-template" data-args="{&quot;templateId&quot;:&quot;template-daily&quot;}" data-key="template:template-daily">
<ha-icon icon="mdi:content-copy" aria-hidden="true">
</ha-icon>
<span class="voc-button-label">Daily vacuum</span>
</button>
<button type="button" class="voc-button voc-button--text" data-action="create-from-template" data-args="{&quot;templateId&quot;:&quot;template-weekly&quot;}" data-key="template:template-weekly">
<ha-icon icon="mdi:content-copy" aria-hidden="true">
</ha-icon>
<span class="voc-button-label">Weekly mop</span>
</button>
</div>
</div>
</div>
</div>
<div class="voc-live-region" aria-live="polite" aria-atomic="true">
</div>
</div>
