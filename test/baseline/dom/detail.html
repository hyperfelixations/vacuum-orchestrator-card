<div class="voc-root" data-state="ready" data-tone="ready" data-density="auto" style="--tone-color:var(--success-color, #0f9d58);--tone-ink:var(--success-color, #0f9d58);--tone-soft:color-mix(in srgb, var(--success-color, #0f9d58) 16%, transparent);--tone-border:color-mix(in srgb, var(--success-color, #0f9d58) 44%, transparent);" tabindex="-1">
<div class="voc-top-line">
</div>
<div class="voc-header" data-parts="icon title pill">

</ha-icon>
</div>
<div class="voc-title-block">

<button type="button" class="voc-back-button" data-action="back">Back</button>
<h2 id="voc-detail-title" tabindex="-1">Kitchen after dinner</h2>
<span class="voc-overlay-status">Queued</span>
</header>
<div class="voc-detail-body">
<div class="voc-detail-summary">
<span>Vacuum, then mop</span>
<span>Kitchen</span>
<span class="voc-job-settings" aria-label="Settings">

<span class="voc-setting-separator" aria-hidden="true"> · </span>
<span class="voc-job-setting" data-setting-key="settingsPolicy">Best effort</span>
</span>
</div>
<section class="voc-detail-block">
<h3>Readiness</h3>

<dd>—</dd>

<div data-detail-field="note">

<dd>—</dd>
</div>

<div data-detail-field="updatedLabel">

</div>

<dd>—</dd>
</div>
<div data-detail-field="retriesJobId">
<dt>Retries job</dt>
<dd>—</dd>

<ha-icon icon="mdi:arrow-collapse-up" aria-hidden="true">
</ha-icon>
<span class="voc-action-label">Move to top</span>
</button>
<button type="button" class="voc-action-button voc-detail-action voc-detail-action-moveBottom" data-action="move-bottom" data-command="move_job" data-job-id="job-a" data-direction="bottom" aria-label="Move to bottom">
<ha-icon icon="mdi:arrow-collapse-down" aria-hidden="true">
</ha-icon>
<span class="voc-action-label">Move to bottom</span>
</button>
<button type="button" class="voc-action-button voc-detail-action voc-detail-action-edit" data-action="edit-job" data-job-id="job-a" aria-label="Edit">
<ha-icon icon="mdi:pencil-outline" aria-hidden="true">
</ha-icon>
<span class="voc-action-label">Edit</span>
</button>

</ha-icon>
<span class="voc-action-label">Delete</span>
</button>
